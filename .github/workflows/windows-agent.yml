name: Windows agent contract
on:
  push:
    branches: [main, codex/issue-3-windows-agent]
  pull_request:
    paths: ['src/EndpointAgent/**', 'installer/**', 'tests/ProtocolHarness/**', 'scripts/windows/windows-smoke.ps1', 'scripts/package-windows-agent.ps1', '.github/workflows/windows-agent.yml']
permissions:
  contents: read
jobs:
  real-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Real agent and independent authenticated peer
        shell: powershell
        run: .\scripts\windows\windows-smoke.ps1
      - name: Build unsigned trial MSI
        shell: powershell
        run: .\scripts\package-windows-agent.ps1
      - name: Upload unsigned trial MSI
        uses: actions/upload-artifact@v4
        with:
          name: squash-endpoint-agent-msi
          path: artifacts/windows-agent/SquashEndpointAgent.msi
          if-no-files-found: error
          retention-days: 7
