services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: rmm
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${RMM_POSTGRES_PASSWORD:?Set a local random URL-safe database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rmm -d rmm]
      interval: 2s
      timeout: 3s
      retries: 20
  control-plane:
    build: .
    environment:
      RMM_DATABASE_URL: postgresql://rmm:${RMM_POSTGRES_PASSWORD}@database/rmm
    ports:
      - 127.0.0.1:18080:8000
    depends_on:
      database:
        condition: service_healthy
volumes:
  database:
